resources:
  jobs:
    fathom_ingest:
      name: fathom_ingest
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: America/Los_Angeles
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      notification_settings:
        no_alert_for_skipped_runs: false
        no_alert_for_canceled_runs: false

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - requests>=2.31
              - ../dist/*.whl

      tasks:
        - task_key: land
          for_each_task:
            inputs: ${var.fathom_accounts}
            concurrency: 2
            task:
              task_key: land_account
              environment_key: default
              retry_on_timeout: true
              max_retries: 2
              min_retry_interval_millis: 30000
              spark_python_task:
                python_file: ../src/ingestion/fathom/land.py
                parameters:
                  - "--slug"
                  - "{{input.slug}}"
                  - "--secret-key"
                  - "{{input.secret_key}}"
                  - "--volume-root"
                  - "${var.volume_root}"
                  - "--state-table"
                  - "${var.catalog}.${var.bronze_schema}.${var.table_prefix}ingest_state"
                  - "--default-start"
                  - "${var.default_start}"
                  - "--run-id"
                  - "{{job.run_id}}"

        - task_key: bronze_load
          depends_on:
            - task_key: land
          run_if: ALL_SUCCESS
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/fathom/bronze_task.py
            parameters:
              - "--volume-root"
              - "${var.volume_root}"
              - "--checkpoint"
              - "${var.volume_root}/_checkpoints/${var.table_prefix}meetings_raw"
              - "--target-table"
              - "${var.catalog}.${var.bronze_schema}.${var.table_prefix}meetings_raw"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/fathom/silver_task.py
            parameters:
              - "--source-table"
              - "${var.catalog}.${var.bronze_schema}.${var.table_prefix}meetings_raw"
              - "--meetings-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_meetings"
              - "--transcripts-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_transcripts"
              - "--action-items-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_action_items"

        - task_key: gold_load
          depends_on:
            - task_key: silver_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/fathom/gold_task.py
            parameters:
              - "--meetings-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_meetings"
              - "--transcripts-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_transcripts"
              - "--action-items-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}fathom_action_items"
              - "--productivity-table"
              - "${var.catalog}.${var.gold_schema}.${var.table_prefix}fathom_team_productivity"
              - "--daily-summary-table"
              - "${var.catalog}.${var.gold_schema}.${var.table_prefix}fathom_meeting_summary_daily"
