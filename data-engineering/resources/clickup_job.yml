resources:
  jobs:
    clickup_ingest:
      name: clickup_ingest
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Los_Angeles
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      notification_settings:
        no_alert_for_skipped_runs: false
        no_alert_for_canceled_runs: false

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - requests>=2.31
              - ../dist/*.whl

      tasks:
        - task_key: land
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/ingestion/clickup/land_task.py
            parameters:
              - "--secret-scope"
              - "mb-ingest"
              - "--secret-key"
              - "clickup-api-token"
              - "--volume-root"
              - "${var.clickup_volume_root}"
              - "--state-table"
              - "${var.catalog}.${var.clickup_bronze_schema}.${var.table_prefix}ingest_state"
              - "--default-start"
              - "${var.default_start}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: bronze_load
          depends_on:
            - task_key: land
          run_if: ALL_SUCCESS
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/clickup/bronze_task.py
            parameters:
              - "--volume-root"
              - "${var.clickup_volume_root}"
              - "--checkpoint-path"
              - "${var.clickup_volume_root}/_checkpoints/bronze"
              - "--target-table"
              - "${var.catalog}.${var.clickup_bronze_schema}.${var.table_prefix}clickup_tasks_raw"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/clickup/silver_task.py
            parameters:
              - "--bronze-table"
              - "${var.catalog}.${var.clickup_bronze_schema}.${var.table_prefix}clickup_tasks_raw"
              - "--silver-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}clickup_tasks"

        - task_key: gold_load
          depends_on:
            - task_key: silver_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/clickup/gold_task.py
            parameters:
              - "--silver-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}clickup_tasks"
              - "--productivity-table"
              - "${var.catalog}.${var.gold_schema}.${var.table_prefix}clickup_team_productivity"
              - "--daily-summary-table"
              - "${var.catalog}.${var.gold_schema}.${var.table_prefix}clickup_task_summary_daily"
