[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mb-data-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pg8000>=1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
spark = ["pyspark==3.5.1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spark: requires a local PySpark session (slow)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so a newer ruff release cannot redden CI on unchanged code.
select = ["E", "F"]
