resources:
  jobs:
    slack_ingest:
      name: slack_ingest
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Los_Angeles
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      notification_settings:
        no_alert_for_skipped_runs: false
        no_alert_for_canceled_runs: false

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - requests>=2.31
              - ../dist/*.whl

      tasks:
        - task_key: land
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/ingestion/slack/land_task.py
            parameters:
              - "--secret-scope"
              - "mb-ingest"
              - "--secret-key"
              - "slack-bot-token"
              - "--volume-root"
              - "${var.slack_volume_root}"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: bronze_load
          depends_on:
            - task_key: land
          run_if: ALL_SUCCESS
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/slack/bronze_task.py
            parameters:
              - "--volume-root"
              - "${var.slack_volume_root}"
              - "--checkpoint-path"
              - "${var.slack_volume_root}/_checkpoints/bronze"
              - "--users-table"
              - "${var.catalog}.${var.slack_bronze_schema}.${var.table_prefix}slack_users_raw"
              - "--channels-table"
              - "${var.catalog}.${var.slack_bronze_schema}.${var.table_prefix}slack_channels_raw"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/slack/silver_task.py
            parameters:
              - "--bronze-users-table"
              - "${var.catalog}.${var.slack_bronze_schema}.${var.table_prefix}slack_users_raw"
              - "--bronze-channels-table"
              - "${var.catalog}.${var.slack_bronze_schema}.${var.table_prefix}slack_channels_raw"
              - "--silver-users-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}slack_users"
              - "--silver-channels-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}slack_channels"
