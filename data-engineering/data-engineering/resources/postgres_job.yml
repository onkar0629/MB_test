resources:
  jobs:
    postgres_ingest:
      name: postgres_ingest
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Los_Angeles
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      notification_settings:
        no_alert_for_skipped_runs: false
        no_alert_for_canceled_runs: false

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - requests>=2.31
              - pg8000>=1.30
              - ../dist/*.whl

      tasks:
        - task_key: land
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/ingestion/postgres/land_task.py
            parameters:
              - "--volume-root"
              - "${var.postgres_volume_root}"
              - "--host"
              - "${var.postgres_host}"
              - "--port"
              - "${var.postgres_port}"
              - "--user"
              - "${var.postgres_user}"
              - "--database"
              - "${var.postgres_database}"
              - "--workspace-schema"
              - "${var.postgres_workspace_schema}"
              - "--secret-scope"
              - "mb-ingest"
              - "--secret-key"
              - "postgres-password"
              - "--state-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}ingest_state"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: bronze_load
          depends_on:
            - task_key: land
          run_if: ALL_SUCCESS
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/postgres/bronze_task.py
            parameters:
              - "--volume-root"
              - "${var.postgres_volume_root}"
              - "--checkpoint-path"
              - "${var.postgres_volume_root}/_checkpoints/bronze"
              - "--people-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_people_raw"
              - "--members-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_workspace_members_raw"
              - "--tasks-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_tasks_raw"
              - "--run-id"
              - "{{job.run_id}}"

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          environment_key: default
          retry_on_timeout: true
          max_retries: 2
          min_retry_interval_millis: 30000
          spark_python_task:
            python_file: ../src/transform/postgres/silver_task.py
            parameters:
              - "--bronze-people-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_people_raw"
              - "--bronze-members-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_workspace_members_raw"
              - "--bronze-tasks-table"
              - "${var.catalog}.${var.postgres_bronze_schema}.${var.table_prefix}twenty_tasks_raw"
              - "--silver-people-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}twenty_people"
              - "--silver-members-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}twenty_workspace_members"
              - "--silver-tasks-table"
              - "${var.catalog}.${var.silver_schema}.${var.table_prefix}twenty_tasks"
              - "--run-id"
              - "{{job.run_id}}"
